name: Build and Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
          description: Environment
          type: environment
          required: true
      publish:
          description: Execute Publish
          type: boolean
          required: true
          default: false

jobs:
  python-versions:
    runs-on: ubuntu-latest
    name: Collect Python versions
    outputs:
      value: ${{ steps.run-script.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/collect-python-versions
        id: run-script
  prebuild:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Prebuild (${{ matrix.os }})
    outputs:
      artifact-name: ${{ steps.prebuild.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Prebuild
        uses: ./.github/actions/prebuild
        id: prebuild
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ${{ fromJson(needs.python-versions.outputs.value) }}
    needs: [ prebuild, python-versions ]
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build input artifact name
        id: build-artifact-name
        run: |
          artifact_name=$(echo '${{ needs.prebuild.outputs.artifact-name }}' | envsubst '$RUNNER_OS')
          echo "$artifact_name"
          echo "value=$artifact_name" >> $GITHUB_OUTPUT
      - name: Download libemoji.a
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.build-artifact-name.outputs.value }}
          path: externals/libemoji/lib
      - name: Check artifact
        run: |
          ls -h lib
          file lib/libemoji.a
      - uses: ./.github/actions/install-os-dependencies
      - uses: ./.github/actions/install-python-dependencies
      - uses: ./.github/actions/build-emojilib
        id: build-emojilib
      - name: Show wheel details
        run: |
          echo ${{ steps.build-emojilib.outputs.wheel-path }}
          echo ${{ steps.build-emojilib.outputs.wheel-filename }}
      - name: Create dist directory
        run: |
          mkdir -p "${{ runner.temp }}/dist/"
          cp "${{ steps.build-emojilib.outputs.wheel-path }}" "${{ runner.temp }}/dist/"
      - name: Create output artifact name
        run: |
          name_tmpl='{{ os }}_{{ python_version }}_whl'
          name='${{ runner.os }}_${{ matrix.python-version }}_whl'
          echo "$name_tmpl"
          echo "$name"
          echo "name_tmpl=$name_tmpl" >> $GITHUB_OUTPUT
          echo "name=$name" >> $GITHUB_OUTPUT
        id: create-output-artifact-name
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create-output-artifact-name.name }}
          path: ${{ runner.temp }}/dist/
  publish:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ${{ fromJson(needs.python-versions.outputs.value) }}
    needs:
      - build
      - python-versions
    environment: ${{ github.event.inputs.environment }}
    if: ${{ github.event.inputs.environment != '' &&  github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    name: Publish (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}
