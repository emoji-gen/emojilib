name: Build and Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
          description: Environment
          type: environment
          required: true
      publish:
          description: Execute Publish
          type: boolean
          required: true
          default: false

jobs:
  python-versions:
    runs-on: ubuntu-latest
    name: Collect Python versions
    outputs:
      value: ${{ steps.run-script.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/collect-python-versions
        id: run-script
      - run: |
          echo ${{ steps.run-script.outputs.python-versions }} >> $GITHUB_STEP_SUMMARY
  prebuild:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Prebuild (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/install-os-dependencies
      - uses: ./.github/actions/build-libemoji
      - name: Upload libemoji.a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libemoji-${{ matrix.os }}
          path: externals/libemoji/lib/libemoji.a
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ${{ fromJson(needs.python-versions.outputs.value) }}
    needs: [ prebuild, python-versions ]
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download libemoji.a
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libemoji-${{ matrix.os }}
          path: externals/libemoji/lib
      - name: Check libemoji.a
        run: |
          ls -h lib
          file lib/libemoji.a
      - uses: ./.github/actions/install-os-dependencies
      - uses: ./.github/actions/install-python-dependencies
      - name: Build emojilib
        uses: ./.github/actions/build-emojilib
        id: build-emojilib
      - name: Create dist directory
        run: |
          mkdir -p "${{ runner.temp }}/dist/"
          cp "${{ steps.build-emojilib.outputs.wheel-path }}" "${{ runner.temp }}/dist/"
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/dist/
  publish:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ${{ fromJson(needs.python-versions.outputs.value) }}
    needs:
      - build
      - python-versions
    environment: ${{ github.event.inputs.environment }}
    if: ${{ github.event.inputs.environment != '' &&  github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    name: Publish (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.14
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
      - name: Check wheel
        run: |
          ls -lh dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}
          skip-existing: true
