name: Build and Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
          description: Environment
          type: environment
          required: true
      publish:
          description: Execute Publish
          type: boolean
          required: true
          default: false

jobs:
  python-versions:
    runs-on: ubuntu-latest
    name: Collect Python versions
    outputs:
      value: ${{ steps.run-script.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/collect-python-versions
        id: run-script
  prebuild:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Prebuild (${{ matrix.os }})
    outputs:
      artifact-name: ${{ steps.prebuild.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Prebuild
        uses: ./.github/actions/prebuild
        id: prebuild
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ${{ fromJson(needs.python-versions.outputs.value) }}
    needs: [ prebuild, python-versions ]
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/build
        with:
          python-version: ${{ matrix.python-version }}
          artifact-name: ${{ needs.prebuild.outputs.artifact-name }}
  publish:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ${{ fromJson(needs.python-versions.outputs.value) }}
    needs:
      - build
      - python-versions
    environment: ${{ github.event.inputs.environment }}
    if: ${{ github.event.inputs.environment != '' &&  github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    name: Publish (${{ matrix.os }}, py${{ matrix.python-version }})
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}
